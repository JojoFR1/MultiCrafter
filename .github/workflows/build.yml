name: Build Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up PATH
      run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Build Mod & Library Jar
      run: ./gradlew deployLib --configuration-cache

    - name: Upload Mod Jar file
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}
        path: build/libs/${{ github.event.repository.name }}.jar
        archive: false
    
    - name: Upload Library Jar file
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}
        path: build/libs/${{ github.event.repository.name }}-lib.jar
        archive: false
